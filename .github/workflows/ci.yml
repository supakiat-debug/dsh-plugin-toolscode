name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # lib/ and test/sdk-slim.test.mjs are dependency-free: pure text transforms,
    # so this job is the honest gate — no registry, no harness install.
    name: pure tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:unit

  harness:
    # Integration suite: mounts the plugin into a real cordis universe (real
    # SystemPrompt, ToolRuntime, dsh-scope chains). Needs the dsh package, which
    # is a full CLI distribution — best effort, but it is what proves the shrink
    # fires on the production topology, so it is not allowed to be silently red.
    name: integration tests against real cordis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install the harness package
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh
      - name: Integration + pure suites
        run: npm test
