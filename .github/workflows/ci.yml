name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    # The honest gate: no registry, no harness install, nothing but Node. This is
    # why the scripts are named test:pure and test:integration rather than one
    # of them being called "unit": until v0.6 the script named test:unit ran the
    # PURE sdk-slim suite, so this job's `npm run test:unit` quietly meant "run
    # the tests that need no dsh". Renaming the script to its real target while
    # leaving this line alone turned the job into a dsh-not-found crash, which is
    # the whole reason the two names are now unambiguous.
    name: pure tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suites that need nothing but Node: the wire shrink over four pinned
      # provider payloads, the pi adapter over a stubbed ExtensionAPI, and the
      # sdk-slim text transforms. The integration suite is the `harness` job's
      # job — it imports cordis from a real dsh install and refuses to load
      # without one, so running it here would only prove that nothing is installed.
      - run: npm run test:pure

  parity:
    # lib/wire.js and adapters/hermes/toolscode/toolscode_core.py are the same program
    # written twice, for the JavaScript harnesses and the Python one. The shared
    # fixture pins a few truncated strings in each language; this job runs every
    # payload through both shrinkers and diffs the whole output, which is the only
    # check that catches the drift those pins miss — a moved key, a different word
    # boundary, a tool reported as shrunk on one side only.
    name: JS and Python shrinkers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hermes adapter tests (standard library only)
        run: python adapters/hermes/test_wire.py
      - name: Cross-language parity
        run: npm run test:parity

  harness:
    # Integration suite: mounts the plugin into a real cordis universe (real
    # SystemPrompt, ToolRuntime, dsh-scope chains) on the production topology.
    # That needs the dsh package. Note every published dsh version is a prerelease,
    # so a bare `npm install @deepseek-ai/dsh` asks for `*`, which never matches a
    # prerelease — install an explicit version or the `latest` dist-tag instead.
    # The pinned version is the one this plugin is deployed against; `latest` is the
    # forward look, and both are hard gates. One suite covers both harness contracts: 0.1
    # presents tools[] through the assembly carrier, 0.2 through a mountable executor, so the
    # universe feature-detects the contract, mounts dsh-tool-executor-native when the harness
    # demands one and runs the plugin with executor: wrap. Only the three cases that exist to
    # pin the executor contract skip, and only on 0.1.
    name: integration against dsh ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.7-rc.2', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install the harness package
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Integration + pure suites
        run: npm test
